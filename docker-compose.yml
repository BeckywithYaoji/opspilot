name: opspilot
services:
  opspilot-api:
    build: .
    image: opspilot:1.0.0
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      TRACE_OUTPUT_PATH: /app/data/traces/traces.jsonl
      HF_HOME: /app/.cache/huggingface
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    ports:
      - "127.0.0.1:${OPSPILOT_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - runtime-data:/app/data
      - model-cache:/app/.cache/huggingface
    restart: unless-stopped
  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:v1.19.0
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': > /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  runtime-data:
  model-cache:
  redis-data:
  qdrant-data:
